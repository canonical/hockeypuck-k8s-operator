[project]
name = "hockeypuck-k8s"
version = "0.0.1"
requires-python = ">=3.14"

# Dependencies of the charm code. Charm libraries from Charmhub are declared in the
# charmcraft.yaml charm-libs block (or by the go-framework extension), not here.
dependencies = [
    "ops==3.9.0",
    "paas-charm==2.0b1",
    "python-gnupg==0.5.6",
    "requests==2.34.2",
]

[dependency-groups]
# PYDEPS from Charmhub libraries used by the charm.
charmlibs-pydeps = []
lint = [
    "black",
    "codespell",
    "flake8",
    "flake8-builtins",
    "flake8-copyright",
    "flake8-docstrings",
    "flake8-docstrings-complete",
    "flake8-test-docs",
    "isort",
    "mypy",
    "pep8-naming",
    "psycopg2-binary",
    "pydocstyle>=2.10",
    "pylint",
    "pyproject-flake8",
    "types-PyYAML",
    "types-requests",
    {include-group = "unit"},
    {include-group = "integration"},
]
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
]
static = [
    "bandit[toml]",
]
integration = [
    "allure-pytest>=2.8.18",
    "allure-pytest-collection-report @ git+https://github.com/canonical/data-platform-workflows@v24.0.0#subdirectory=python/pytest_plugins/allure_pytest_collection_report",
    # pytest-operator pins pytest-asyncio 0.21, which breaks on pytest 9.2.
    "pytest<9.2",
    "pytest-asyncio",
    "pytest-dependency",
    "pytest-operator",
]

[tool.bandit]
exclude_dirs = ["/venv/"]
[tool.bandit.assert_used]
skips = ["*/*test.py", "*/test_*.py", "*tests/*.py"]

# Testing tools configuration
[tool.coverage.run]
branch = true

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py314"]

[tool.coverage.report]
show_missing = true

# Linting tools configuration
[tool.flake8]
max-line-length = 99
max-doc-length = 99
max-complexity = 10
exclude = [".git", "__pycache__", ".tox", "build", "dist", "*.egg_info", "venv"]
select = ["E", "W", "F", "C", "N", "R", "D", "H"]
# Ignore W503, E501 because using black creates errors with this
# Ignore D107 Missing docstring in __init__
ignore = ["W503", "E501", "D107"]
# D100, D101, D102, D103: Ignore missing docstrings in tests
per-file-ignores = ["tests/*:D100,D101,D102,D103,D104,D205,D212,D415"]
docstring-convention = "google"

[tool.isort]
line_length = 99
profile = "black"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "tests.*"

[tool.pylint]
disable = "wrong-import-order"

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
addopts = "--strict-markers"

# Linting tools configuration
[tool.ruff]
line-length = 99
select = ["E", "W", "F", "C", "N", "D", "I001"]
extend-ignore = [
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
ignore = ["E501", "D107"]
extend-exclude = ["__pycache__", "*.egg_info"]
per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}

[tool.ruff.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"
